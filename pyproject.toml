[project]
name = "blackline"
version = "0.1.0"
description = "Slack governance agent: finds card numbers, SINs, secrets and third-party PII in text, voice and images, then masks or blocks them."
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.21",
    "slack-sdk>=3.33",
    "openai>=1.50",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "faker>=30"]
gcp = ["google-cloud-secret-manager>=2.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
